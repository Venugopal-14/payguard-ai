<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg2)"/>

  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
  </g>

  <!-- logo mark -->
  <rect x="300" y="250" width="80" height="80" rx="18" fill="url(#accent2)"/>
  <text x="340" y="306" text-anchor="middle" font-size="46" font-weight="800" fill="#06111f">P</text>
  <text x="406" y="310" font-size="56" font-weight="800" fill="#ffffff">PayGuard AI</text>

  <!-- summary -->
  <text x="300" y="430" font-size="40" font-weight="700" fill="url(#accent2)">Let AI act. Never let AI spend blindly.</text>

  <text x="300" y="500" font-size="26" fill="#cbd5e1">Deterministic risk + policy engines · human-in-the-loop approval</text>
  <text x="300" y="540" font-size="26" fill="#cbd5e1">PayPal Sandbox lifecycle · signature-verified webhooks · immutable audit trail</text>
  <text x="300" y="580" font-size="22" fill="#64748b">AI runs in deterministic fallback in this deployment · fraud analytics are simulated</text>

  <!-- links -->
  <text x="300" y="720" font-size="24" fill="#94a3b8">Code</text>
  <text x="300" y="756" font-size="28" font-weight="600" fill="#38bdf8">github.com/Venugopal-14/payguard-ai</text>

  <text x="300" y="820" font-size="24" fill="#94a3b8">Live demo</text>
  <text x="300" y="856" font-size="28" font-weight="600" fill="#34d399">payguard-frontend-ybl6.onrender.com</text>

  <!-- accent bar -->
  <rect x="300" y="900" width="420" height="6" rx="3" fill="url(#accent2)"/>
</svg>
