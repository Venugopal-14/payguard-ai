<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{rx:10;ry:10;stroke-width:1.5;}
      .lbl{fill:#0f172a;font-size:13px;}
      .sub{fill:#475569;font-size:11px;}
      .edge{stroke:#0f766e;stroke-width:2;fill:none;marker-end:url(#arrow);}
      .edgeDashed{stroke:#64748b;stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#arrowGray);}
      .edgeLbl{fill:#0f766e;font-size:11px;font-weight:600;}
      .edgeLblGray{fill:#64748b;font-size:11px;font-weight:600;}
      .title{fill:#0f172a;font-size:22px;font-weight:700;}
      .principle{fill:#0f766e;font-size:13px;font-weight:600;}
      .note{fill:#b45309;font-size:11px;font-weight:600;}
      .zone{fill:none;stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 4;rx:14;ry:14;}
      .zoneLbl{fill:#94a3b8;font-size:11px;font-weight:700;letter-spacing:1px;}
    </style>
  </defs>

  <rect width="960" height="1120" fill="#f8fafc"/>

  <text x="40" y="44" class="title">PayGuard AI — Architecture</text>
  <text x="40" y="68" class="principle">AI recommends → PayGuard authorizes → PayPal executes</text>
  <text x="40" y="88" class="note">⚠ AI provider currently runs in deterministic rule-based FALLBACK mode (no LLM key); the LLM path is implemented.</text>

  <!-- User -->
  <rect class="box" x="360" y="110" width="240" height="52" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="480" y="132" text-anchor="middle" class="lbl" font-weight="600">User / Merchant</text>
  <text x="480" y="150" text-anchor="middle" class="sub">natural-language mission + budget</text>

  <!-- Frontend zone -->
  <rect class="zone" x="320" y="188" width="320" height="78"/>
  <text x="332" y="206" class="zoneLbl">FRONTEND · Next.js 14</text>
  <rect class="box" x="340" y="214" width="280" height="44" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="480" y="232" text-anchor="middle" class="lbl" font-weight="600">Control-plane UI (app/lib/api.ts)</text>
  <text x="480" y="249" text-anchor="middle" class="sub">connection retry + error banner</text>

  <!-- Backend zone -->
  <rect class="zone" x="40" y="292" width="880" height="470"/>
  <text x="52" y="310" class="zoneLbl">BACKEND · FastAPI</text>

  <!-- API guard -->
  <rect class="box" x="360" y="320" width="240" height="46" fill="#f1f5f9" stroke="#64748b"/>
  <text x="480" y="339" text-anchor="middle" class="sub" font-style="italic">Optional API-key guard — core/security.py</text>
  <text x="480" y="356" text-anchor="middle" class="sub" font-style="italic">opt-in, OFF by default</text>

  <!-- API -->
  <rect class="box" x="360" y="382" width="240" height="40" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="480" y="406" text-anchor="middle" class="lbl" font-weight="600">Control-plane API — api/payguard.py</text>

  <!-- Agent -->
  <rect class="box" x="360" y="440" width="240" height="56" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="480" y="460" text-anchor="middle" class="lbl" font-weight="600">AI Agent — PROPOSES ONLY</text>
  <text x="480" y="477" text-anchor="middle" class="sub">LLM (Ollama/OpenAI) OR rule-based fallback</text>

  <!-- Risk -->
  <rect class="box" x="360" y="514" width="240" height="58" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="480" y="534" text-anchor="middle" class="lbl" font-weight="600">Risk Engine (deterministic)</text>
  <text x="480" y="551" text-anchor="middle" class="sub">12 factors · 0–100 · LOW/MED/HIGH/CRITICAL</text>

  <!-- Policy -->
  <rect class="box" x="360" y="590" width="240" height="44" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <text x="480" y="609" text-anchor="middle" class="lbl" font-weight="700">Policy Engine (authority)</text>
  <text x="480" y="626" text-anchor="middle" class="sub">engine/policy.py</text>

  <!-- Decision branches -->
  <rect class="box" x="60" y="660" width="200" height="46" fill="#fee2e2" stroke="#dc2626"/>
  <text x="160" y="679" text-anchor="middle" class="lbl" font-weight="600">BLOCKED (terminal)</text>
  <text x="160" y="696" text-anchor="middle" class="sub">no PayPal order</text>

  <rect class="box" x="380" y="660" width="200" height="46" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="480" y="679" text-anchor="middle" class="lbl" font-weight="600">AWAITING_APPROVAL</text>
  <text x="480" y="696" text-anchor="middle" class="sub">human approves → APPROVED</text>

  <rect class="box" x="700" y="660" width="200" height="46" fill="#dcfce7" stroke="#16a34a"/>
  <text x="800" y="679" text-anchor="middle" class="lbl" font-weight="600">APPROVED</text>
  <text x="800" y="696" text-anchor="middle" class="sub">eligible for execution</text>

  <!-- Lifecycle -->
  <rect class="box" x="700" y="724" width="200" height="56" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="800" y="744" text-anchor="middle" class="lbl" font-weight="600">Lifecycle state machine</text>
  <text x="800" y="761" text-anchor="middle" class="sub">engine/lifecycle.py</text>

  <!-- PayPal -->
  <rect class="box" x="700" y="824" width="200" height="60" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="800" y="846" text-anchor="middle" class="lbl" font-weight="700">PayPal Sandbox</text>
  <text x="800" y="863" text-anchor="middle" class="sub">OAuth2 · Orders v2</text>
  <text x="800" y="878" text-anchor="middle" class="sub">create → approve → capture</text>

  <!-- Webhook -->
  <rect class="box" x="430" y="824" width="210" height="60" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="535" y="846" text-anchor="middle" class="lbl" font-weight="600">Webhook handler</text>
  <text x="535" y="863" text-anchor="middle" class="sub">api/webhooks.py</text>
  <text x="535" y="878" text-anchor="middle" class="sub">signature-verified + idempotent</text>

  <!-- Persistence zone -->
  <rect class="zone" x="40" y="912" width="880" height="150"/>
  <text x="52" y="930" class="zoneLbl">PERSISTENCE · PostgreSQL 17</text>

  <rect class="box" x="120" y="946" width="240" height="60" fill="#e2e8f0" stroke="#475569"/>
  <text x="240" y="968" text-anchor="middle" class="lbl" font-weight="600">Database</text>
  <text x="240" y="985" text-anchor="middle" class="sub">transactions · missions</text>
  <text x="240" y="1000" text-anchor="middle" class="sub">audit_events · webhook_events</text>

  <rect class="box" x="400" y="946" width="240" height="60" fill="#e2e8f0" stroke="#475569"/>
  <text x="520" y="968" text-anchor="middle" class="lbl" font-weight="600">Immutable audit trail</text>
  <text x="520" y="985" text-anchor="middle" class="sub">actors + correlation IDs</text>
  <text x="520" y="1000" text-anchor="middle" class="sub">secrets sanitized</text>

  <rect class="box" x="680" y="946" width="240" height="60" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="800" y="968" text-anchor="middle" class="lbl" font-weight="600">Fraud analytics (SIMULATED)</text>
  <text x="800" y="985" text-anchor="middle" class="sub">engine/analytics.py</text>
  <text x="800" y="1000" text-anchor="middle" class="sub">+ Prometheus /metrics</text>

  <!-- EDGES -->
  <!-- user -> fe -->
  <path class="edge" d="M480,162 L480,214"/>
  <!-- fe -> guard -->
  <path class="edge" d="M480,258 L480,320"/>
  <text x="492" y="286" class="edgeLbl">REST /api/*</text>
  <!-- guard -> api -->
  <path class="edge" d="M480,366 L480,382"/>
  <!-- api -> agent -->
  <path class="edge" d="M480,422 L480,440"/>
  <!-- agent -> risk -->
  <path class="edge" d="M480,496 L480,514"/>
  <text x="492" y="509" class="edgeLbl">proposal</text>
  <!-- risk -> policy -->
  <path class="edge" d="M480,572 L480,590"/>
  <text x="492" y="586" class="edgeLbl">score + level</text>

  <!-- policy -> BLOCK -->
  <path class="edge" d="M400,623 C300,645 240,645 180,660"/>
  <text x="250" y="640" text-anchor="middle" class="edgeLbl">BLOCK</text>
  <!-- policy -> AWAIT -->
  <path class="edge" d="M480,634 L480,660"/>
  <text x="520" y="650" class="edgeLbl">NEEDS_APPROVAL</text>
  <!-- policy -> APPROVED -->
  <path class="edge" d="M560,623 C680,645 740,645 790,660"/>
  <text x="700" y="640" text-anchor="middle" class="edgeLbl">APPROVE</text>

  <!-- await -> approved -->
  <path class="edge" d="M580,683 L700,683"/>
  <text x="640" y="676" text-anchor="middle" class="edgeLbl">human</text>

  <!-- approved -> lifecycle -->
  <path class="edge" d="M800,706 L800,724"/>
  <!-- lifecycle -> paypal -->
  <path class="edge" d="M800,780 L800,824"/>
  <text x="812" y="806" class="edgeLbl">create order</text>
  <!-- paypal -> lifecycle (completed) -->
  <path class="edge" d="M884,824 C920,790 920,760 884,752"/>
  <text x="915" y="792" text-anchor="middle" class="edgeLbl">COMPLETED</text>
  <!-- paypal -> webhook (dashed) -->
  <path class="edgeDashed" d="M700,860 L640,860"/>
  <text x="670" y="852" text-anchor="middle" class="edgeLblGray">signed event</text>
  <!-- webhook -> lifecycle -->
  <path class="edge" d="M560,824 C600,795 680,770 720,762"/>
  <text x="610" y="800" text-anchor="middle" class="edgeLbl">verify + reconcile</text>

  <!-- api -> db -->
  <path class="edge" d="M380,402 C120,430 120,900 230,946"/>
  <text x="150" y="700" text-anchor="middle" class="edgeLbl">persist</text>
  <!-- lifecycle -> audit -->
  <path class="edge" d="M700,760 C560,850 540,900 520,946"/>
  <text x="600" y="905" text-anchor="middle" class="edgeLbl">audit events</text>
  <!-- audit -> db -->
  <path class="edge" d="M400,978 L360,978"/>
  <!-- db -> analytics -->
  <path class="edge" d="M640,976 L680,976"/>
  <!-- analytics -> fe (up the right side) -->
  <path class="edgeDashed" d="M920,960 C948,700 948,250 622,236"/>
  <text x="905" y="500" text-anchor="middle" class="edgeLblGray">/analytics/fraud</text>
</svg>
