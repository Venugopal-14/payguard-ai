<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- subtle grid accent -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
  </g>

  <!-- logo mark -->
  <rect x="300" y="360" width="96" height="96" rx="22" fill="url(#accent)"/>
  <text x="348" y="426" text-anchor="middle" font-size="56" font-weight="800" fill="#06111f">P</text>

  <!-- title -->
  <text x="430" y="408" font-size="86" font-weight="800" fill="#ffffff">PayGuard AI</text>
  <text x="432" y="470" font-size="30" font-weight="500" fill="#94a3b8">Secure payment control plane for AI agents</text>

  <!-- tagline -->
  <text x="300" y="620" font-size="44" font-weight="700" fill="url(#accent)">AI recommends.&#160;&#160;PayGuard authorizes.&#160;&#160;PayPal executes.</text>

  <!-- honest sub-note -->
  <text x="300" y="690" font-size="24" fill="#cbd5e1">AI proposes · deterministic risk + policy engines decide · PayPal Sandbox executes</text>

  <!-- hackathon line -->
  <text x="300" y="900" font-size="24" fill="#64748b">Built for the “Build What's Next with PayPal and AI” hackathon</text>

  <!-- accent bar -->
  <rect x="300" y="930" width="420" height="6" rx="3" fill="url(#accent)"/>
</svg>
